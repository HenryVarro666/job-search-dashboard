<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Job Search Dashboard: illustrative demo layout</title>
  <desc id="desc">An illustrative dashboard with synthetic data. A daily action list, separate weekly application and referral bars, and a job-detail side panel show the intended interaction design. This is authored documentation artwork, not a screenshot of the application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8edf3"/><stop offset="1" stop-color="#f1eee6"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#213043" flood-opacity=".10"/></filter>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#1c2736}
      .title{font-weight:700;font-size:24px;letter-spacing:-.6px}
      .heading{font-weight:700;font-size:18px;letter-spacing:-.25px}
      .body{font-size:15px}
      .small{font-size:13px;fill:#637185}
      .tiny{font-size:12px;fill:#637185}
      .label{font-size:12px;font-weight:700;letter-spacing:1.4px;fill:#7a8794}
      .bold{font-weight:700}
      .blue{fill:#356bd8}
      .muted{fill:#637185}
      .line{stroke:#e0e5ec;stroke-width:1}
    </style>
  </defs>
  <rect width="1440" height="980" rx="28" fill="url(#bg)"/>
  <text x="56" y="56" class="label">LOCAL WORKSPACE</text>
  <text x="56" y="98" font-size="32" font-weight="700" letter-spacing="-.8">A clear next step, with the record beside it.</text>
  <rect x="1070" y="54" width="314" height="36" rx="18" fill="#ffffff" fill-opacity=".8"/>
  <circle cx="1090" cy="72" r="4" fill="#477c6c"/>
  <text x="1102" y="77" class="small">Illustration · synthetic data only</text>

  <g filter="url(#shadow)">
    <rect x="48" y="132" width="1344" height="776" rx="18" fill="#f6f7f9"/>
    <path d="M66 132h1308a18 18 0 0 1 18 18v70H48v-70a18 18 0 0 1 18-18" fill="#ffffff"/>
  </g>
  <rect x="76" y="158" width="34" height="34" rx="10" fill="#356bd8"/>
  <path d="m86 175 5 5 10-12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="122" y="182" class="title">Job Search</text>
  <rect x="318" y="154" width="318" height="42" rx="10" fill="#f6f7f8" stroke="#e5e8ec"/>
  <circle cx="340" cy="173" r="6" fill="none" stroke="#8b96a2" stroke-width="1.5"/><path d="m345 178 5 5" stroke="#8b96a2" stroke-width="1.5"/>
  <text x="362" y="180" class="small">Find a company, role, or req</text>
