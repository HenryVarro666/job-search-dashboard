  <text x="184" y="258" class="body muted">Opportunities</text>
  <text x="316" y="258" class="body muted">Progress</text>
  <text x="412" y="258" class="body muted">Internships</text>
  <text x="778" y="258" class="small">All companies</text>
  <path d="m888 252 5 5 5-5" stroke="#637185" fill="none" stroke-width="1.5"/>

  <text x="76" y="311" class="title">Ready to move forward</text>
  <text x="76" y="335" class="small">Tasks first. Open a record without leaving your list.</text>

