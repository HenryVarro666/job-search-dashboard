  <rect x="730" y="693" width="10" height="10" rx="2" fill="#9cb5d9"/><text x="747" y="703" class="tiny">Referral requests</text>
  <line x1="113" x2="870" y1="738" y2="738" class="line"/><line x1="113" x2="870" y1="777" y2="777" class="line"/><line x1="113" x2="870" y1="816" y2="816" stroke="#cfd7df"/>
  <text x="96" y="742" class="tiny">4</text><text x="96" y="781" class="tiny">2</text><text x="96" y="820" class="tiny">0</text>
  <g fill="#356bd8"><rect x="157" y="777" width="23" height="39" rx="3"/><rect x="269" y="757" width="23" height="59" rx="3"/><rect x="381" y="796" width="23" height="20" rx="3"/><rect x="493" y="738" width="23" height="78" rx="3"/><rect x="605" y="757" width="23" height="59" rx="3"/><rect x="717" y="777" width="23" height="39" rx="3" opacity=".55"/></g>
  <g fill="#9cb5d9"><rect x="185" y="796" width="23" height="20" rx="3"/><rect x="297" y="777" width="23" height="39" rx="3"/><rect x="409" y="777" width="23" height="39" rx="3"/><rect x="521" y="796" width="23" height="20" rx="3"/><rect x="633" y="777" width="23" height="39" rx="3"/><rect x="745" y="796" width="23" height="20" rx="3" opacity=".55"/></g>
  <text x="155" y="838" class="tiny">Week 1</text><text x="267" y="838" class="tiny">Week 2</text><text x="379" y="838" class="tiny">Week 3</text><text x="491" y="838" class="tiny">Week 4</text><text x="603" y="838" class="tiny">Week 5</text><text x="715" y="838" class="tiny">This week</text>
  <text x="96" y="862" class="tiny">Separate event dates · current week is incomplete</text>

  <path d="M950 220h442v670a18 18 0 0 1-18 18H950Z" fill="#fff"/>
  <line x1="950" x2="950" y1="220" y2="908" stroke="#dce3eb"/>
  <text x="978" y="257" class="label">RECORD DETAILS</text>
