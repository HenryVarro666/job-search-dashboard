  <path d="M1343 167v16m-8-8h16" stroke="#6c7e93" stroke-width="1.5"/>
  <line x1="48" x2="1392" y1="220" y2="220" class="line"/>

  <rect x="76" y="236" width="84" height="34" rx="8" fill="#e8eff9"/>
