  <rect x="102" y="575" width="62" height="25" rx="6" fill="#f6efdf"/>
  <text x="114" y="592" class="tiny" style="fill:#9a7134">Decide</text>
  <text x="180" y="586" class="body bold">Example Systems</text>
  <text x="180" y="604" class="tiny">Confirm the location requirement · DEMO-02</text>
