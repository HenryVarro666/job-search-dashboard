  <text x="1008" y="752" class="small">Details stay linked to their evidence</text>
  <rect x="978" y="793" width="386" height="58" rx="8" fill="#f6f7f8"/>
  <text x="994" y="817" class="small">Close this panel to return to the same</text>
  <text x="994" y="837" class="small">list position and filters.</text>

  <text x="56" y="945" class="small">Authored product illustration, not an application screenshot. Labels are translated for this overview.</text>
