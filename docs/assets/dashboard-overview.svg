  <text x="978" y="300" class="title">Example Research</text>
  <text x="978" y="326" class="body muted">Research Scientist · DEMO-01</text>
  <rect x="978" y="345" width="176" height="29" rx="14" fill="#e9f0fb"/>
  <circle cx="992" cy="359" r="4" fill="#356bd8"/>
  <text x="1004" y="364" class="small blue">Assessment pending</text>
  <line x1="978" x2="1364" y1="396" y2="396" class="line"/>
  <text x="978" y="427" class="heading">Next step</text>
  <text x="978" y="456" class="body">Review the invitation and confirm</text>
  <text x="978" y="478" class="body">the assessment arrangements.</text>
  <rect x="978" y="497" width="162" height="37" rx="8" fill="#356bd8"/>
  <text x="999" y="521" font-size="14" font-weight="700" style="fill:#fff">Open source record</text>
  <text x="978" y="574" class="heading">Recorded history</text>
  <line x1="988" x2="988" y1="603" y2="727" stroke="#dbe5f1" stroke-width="2"/>
  <circle cx="988" cy="606" r="5" fill="#356bd8"/>
